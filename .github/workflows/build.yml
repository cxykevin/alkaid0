name: Build and Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          check-latest: true

      - name: 安装 UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: 执行代码生成
        run: |
          go generate ./...
          go generate product/gen.go

      - name: 构建 Linux amd64 (纯 Go)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o alkaid0-linux-amd64 .

      - name: 构建 Windows amd64 (交叉编译)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o alkaid0-windows-amd64.exe .

      - name: 构建 Linux arm64 (交叉编译)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o alkaid0-linux-arm64 .

      - name: UPX 极限压缩
        run: |
          upx --best --lzma alkaid0-linux-amd64
          upx --best --lzma alkaid0-windows-amd64.exe
          upx --best --lzma alkaid0-linux-arm64

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: alkaid0-linux-windows-binaries
          path: |
            alkaid0-linux-amd64
            alkaid0-windows-amd64.exe
            alkaid0-linux-arm64

  build-darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          check-latest: true

      - name: 执行代码生成
        run: |
          go generate ./...
          go generate product/gen.go

      - name: 构建 Darwin amd64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o alkaid0-darwin-amd64 .

      - name: 构建 Darwin arm64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o alkaid0-darwin-arm64 .

      - name: 上传 Darwin 产物
        uses: actions/upload-artifact@v7
        with:
          name: alkaid0-darwin-binaries
          path: |
            alkaid0-darwin-amd64
            alkaid0-darwin-arm64

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: false
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          check-latest: true

      - name: 静态分析
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...

      - name: 数据竞争检测
        env:
          ALKAID0_DEBUG_MOCKSERVER: "true"
          ALKAID0_CONFIG_PATH: "alklog.log"
          ALKAID0_TEST_LESS_MEMORY_MODE: "true"
        run: |
          go test -race -count=1 ./config/... ./library/... ./log/... ./mock/... ./provider/parser/... ./provider/request/structs/... ./storage/... ./terminal/buffer/... ./tools/... ./ui/...

      - name: 运行测试
        env:
          ALKAID0_DEBUG_MOCKSERVER: "true"
          ALKAID0_CONFIG_PATH: "alklog.log"
          # ALKAID0_TEST_SANDBOX: "true"
          ALKAID0_TEST_LESS_MEMORY_MODE: "true"
          CGO_ENABLED: "0"
        run: |
          go test -v ./...

  build-msix:
    runs-on: windows-latest
    needs: [ build ]
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6

      # 使用官方 Action 安装 WinApp CLI
      - name: Setup winapp CLI
        uses: microsoft/setup-WinAppCli@v0.1

      # 使用 MSYS2 安装 MinGW-w64 GCC
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc   # 安装 MinGW-w64 GCC

      # 图像处理工具（feraxhp.cim）仍然通过 winget 安装
      - name: 安装图像处理工具
        run: |
          winget install --id feraxhp.cim --accept-package-agreements --accept-source-agreements
          echo "C:\Program Files\cim\bin" >> $GITHUB_PATH

      - name: 下载 Windows 二进制产物
        uses: actions/download-artifact@v8
        with:
          name: alkaid0-linux-windows-binaries   # 包含 alkaid0-windows-amd64.exe
          path: ./temp_bin

      - name: 准备 MSIX 目录
        run: |
          cd installer/windows/msix
          copy ..\..\..\temp_bin\alkaid0-windows-amd64.exe .\alkaid0.exe

      - name: 写入证书密钥
        shell: pwsh
        env:
          CERT_KEY: ${{ secrets.CERT_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERT_KEY)) {
            Write-Host "⚠️ CERT_KEY secret 未设置，正在生成新证书..."
            # 生成自签名证书
            winapp cert generate --publisher "CN=cxykevin" --output ./devcert.pfx
            # 读取 PFX 并转为 Base64
            $bytes = [System.IO.File]::ReadAllBytes("./devcert.pfx")
            $base64 = [System.Convert]::ToBase64String($bytes)
            $base64 | Out-File -FilePath "installer/windows/msix/.cert.tmp" -Encoding utf8
            Remove-Item ./devcert.pfx
            Write-Host "✅ 新证书已生成并保存为 Base64 格式 (installer/windows/msix/.cert.tmp)"
          } else {
            $env:CERT_KEY | Out-File -FilePath "installer/windows/msix/.cert.tmp" -Encoding utf8
            Write-Host "✅ 使用来自 CERT_KEY secret 的现有证书"
          }

      - name: 执行打包脚本
        shell: pwsh
        run: |
          cd installer/windows/msix
          .\pack.ps1

      - name: 上传 MSIX 产物
        uses: actions/upload-artifact@v7
        with:
          name: alkaid0-msix
          path: installer/windows/msix/alkaid0-windows-amd64.msix

  build-linux-pkgs:
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6

      - name: 下载 Linux 二进制产物
        uses: actions/download-artifact@v8
        with:
          name: alkaid0-linux-windows-binaries   # 包含 alkaid0-windows-amd64.exe
          path: ./temp_bin

      - name: 安装 nFPM
        uses: burningalchemist/action-gh-nfpm@v1

      - name: 准备 nFPM 目录
        run: |
          cd installer/linux
          cp ../../temp_bin/alkaid0-linux-amd64 ./alkaid0-linux-amd64
          cp ../../temp_bin/alkaid0-linux-arm64 ./alkaid0-linux-arm64
          mkdir output
          
      - name: nFPM 打包
        run: |
          cd installer/linux
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$VERSION" ]; then
              VERSION="0.0.0"
          fi
          VERSION=${VERSION#v}
          export VERSION
          
          for arch in amd64 arm64; do
              for packager in apk deb archlinux rpm; do
                  # 根据包类型确定文件后缀
                  case $packager in
                      apk)       suffix="apk" ;;
                      deb)       suffix="deb" ;;
                      archlinux) suffix="pkg.tar.zst" ;;
                      rpm)       suffix="rpm" ;;
                  esac
                  
                  # 替换模板中的变量，生成 nfpm.yml
                  sed -e "s/\${VERSION}/$VERSION/g" \
                      -e "s/\${GOARCH}/$arch/g" \
                      -e "s/\${BINARY_ARCH}/$arch/g" \
                      nfpm.template.yaml > nfpm.yaml
                  
                  # 执行打包命令
                  BINARY_ARCH="$arch" GOARCH="$arch" \
                  nfpm pkg \
                      --target "./output/alkaid0-linux-${arch}.${suffix}" \
                      --packager "$packager"
              done
          done
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: alkaid0-linux-pkgs
          path: installer/linux/output/*

  publish:
    runs-on: ubuntu-latest
    needs: [ build, build-darwin, test, build-msix, build-linux-pkgs ]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
    steps:
      - name: 下载 Linux/Windows 产物
        uses: actions/download-artifact@v8
        with:
          name: alkaid0-linux-windows-binaries
          path: ./binaries

      - name: 下载 Darwin 产物
        uses: actions/download-artifact@v8
        with:
          name: alkaid0-darwin-binaries
          path: ./binaries

      - name: 下载 MSIX 产物
        uses: actions/download-artifact@v8
        with:
          name: alkaid0-msix
          path: ./binaries
          
      - name: 下载 Linux 包
        uses: actions/download-artifact@v8
        with:
          name: alkaid0-linux-pkgs
          path: ./binaries

      - name: 上传到 Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步到 Gitee Release
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          GITEE_URL: ${{ secrets.GITEE_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
        run: |
          set -euo pipefail

          if [ -z "$GITEE_ACCESS_TOKEN" ] || [ -z "$GITEE_URL" ]; then
            echo "GITEE_ACCESS_TOKEN 或 GITEE_URL 未设置，跳过 Gitee Release 同步"
            exit 0
          fi

          repo_url="$(printf '%s' "$GITEE_URL" | xargs)"
          repo_url="${repo_url%/}"
          repo_url="${repo_url%.git}"
          if [[ "$repo_url" =~ ^https?://([^/]+)/(.*)$ ]]; then
            gitee_origin="${BASH_REMATCH[1]}"
            repo_path="${BASH_REMATCH[2]}"
          else
            gitee_origin="gitee.com"
            repo_path="$repo_url"
          fi
          repo_path="${repo_path#/}"
          if [[ ! "$repo_path" =~ ^([^/]+)/([^/]+)$ ]]; then
            echo "GITEE_URL 必须是 owner/repo 或包含 owner/repo 的仓库 URL"
            exit 1
          fi
          owner="${BASH_REMATCH[1]}"
          repo="${BASH_REMATCH[2]}"
          echo "准备同步 Gitee Release：${gitee_origin}/${owner}/${repo}"
          api_url="https://${gitee_origin}/api/v5/repos/${owner}/${repo}"

          response_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -f "$response_file" "$error_file"' EXIT

          request_release() {
            local method="$1"
            local url="$2"
            local status
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 \
              --request "$method" \
              --header "Authorization: token ${GITEE_ACCESS_TOKEN}" \
              --data-urlencode "access_token=${GITEE_ACCESS_TOKEN}" \
              --data-urlencode "tag_name=${RELEASE_TAG}" \
              --data-urlencode "name=${RELEASE_NAME}" \
              --data-urlencode "body=${RELEASE_BODY}" \
              --data-urlencode "target_commitish=${GITHUB_SHA}" \
              --data-urlencode "prerelease=${RELEASE_PRERELEASE}" \
              --data-urlencode "draft=${RELEASE_DRAFT}" \
              "$url" 2>"$error_file")" || {
                echo "${method} Gitee Release 请求失败"
                cat "$error_file"
                exit 1
              }
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "${method} Gitee Release 失败，HTTP ${status}"
              cat "$response_file"
              exit 1
            fi
          }

          release_url="${api_url}/releases/tags/${RELEASE_TAG}"
          if ! release_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 \
            --header "Authorization: token ${GITEE_ACCESS_TOKEN}" \
            --get --data-urlencode "access_token=${GITEE_ACCESS_TOKEN}" "$release_url" 2>"$error_file")"; then
            echo "查询 Gitee Release 时网络请求失败"
            cat "$error_file"
            exit 1
          fi
          case "$release_status" in
            200)
              if release_id="$(jq -er '.id // empty' "$response_file")"; then
                request_release PATCH "${api_url}/releases/${release_id}"
              else
                echo "Gitee Release 按 tag 查询为空，创建新 Release"
                request_release POST "${api_url}/releases"
                if ! release_id="$(jq -er '.id // empty' "$response_file")"; then
                  echo "Gitee Release 创建响应缺少 id"
                  cat "$response_file"
                  exit 1
                fi
              fi
              ;;
            404)
              request_release POST "${api_url}/releases"
              if ! release_id="$(jq -er '.id // empty' "$response_file")"; then
                echo "Gitee Release 创建响应缺少 id"
                cat "$response_file"
                exit 1
              fi
              ;;
            *)
              echo "查询 Gitee Release 失败，HTTP ${release_status}"
              exit 1
              ;;
          esac

          existing_files="$(mktemp)"
          trap 'rm -f "$response_file" "$error_file" "$existing_files"' EXIT
          if ! files_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 \
            --header "Authorization: token ${GITEE_ACCESS_TOKEN}" \
            --get --data-urlencode "access_token=${GITEE_ACCESS_TOKEN}" \
            "${api_url}/releases/${release_id}/attach_files" 2>"$error_file")"; then
            echo "获取 Gitee Release 附件列表时网络请求失败"
            cat "$error_file"
            exit 1
          fi
          if [ "$files_status" != "200" ]; then
            echo "获取 Gitee Release 附件列表失败，HTTP ${files_status}"
            cat "$response_file"
            exit 1
          fi
          jq -r '.[].name' "$response_file" >"$existing_files"

          shopt -s nullglob
          for asset in ./binaries/*; do
            asset_name="$(basename "$asset")"
            if grep -Fxq "$asset_name" "$existing_files"; then
              echo "Gitee Release 已存在附件，跳过 ${asset_name}"
              continue
            fi
            echo "上传 Gitee Release 附件 ${asset_name}"
            if ! upload_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300 \
              --request POST \
              --header "Authorization: token ${GITEE_ACCESS_TOKEN}" \
              --form "access_token=${GITEE_ACCESS_TOKEN}" \
              --form "file=@${asset}" \
              "${api_url}/releases/${release_id}/attach_files" 2>"$error_file")"; then
              echo "上传 Gitee Release 附件时网络请求失败：${asset_name}"
              cat "$error_file"
              exit 1
            fi
            if [[ ! "$upload_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "上传 Gitee Release 附件失败：${asset_name}，HTTP ${upload_status}"
              cat "$response_file"
              exit 1
            fi
          done
